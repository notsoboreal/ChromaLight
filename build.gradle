plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

// Keep the compiled version, loader metadata and artifact name in sync.
def versionSourceDirectory = layout.buildDirectory.dir('generated/sources/modVersion/java')
def generateModVersion = tasks.register('generateModVersion') {
    inputs.property('modVersion', project.version.toString())
    outputs.dir(versionSourceDirectory)
    doLast {
        def destination = versionSourceDirectory.get().file('dev/nightmode/chromalight/BuildVersion.java').asFile
        destination.parentFile.mkdirs()
        destination.setText("""package dev.nightmode.chromalight;

/** Generated from gradle.properties; do not edit. */
final class BuildVersion {
    static final String VERSION = "${project.version}";
    private BuildVersion() {}
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(versionSourceDirectory)
tasks.named('compileJava') { dependsOn generateModVersion }
tasks.named('sourcesJar', Jar) {
    dependsOn generateModVersion
    from('LICENSE')
}

def modMetadata = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                   mod_authors: mod_authors, mod_license: mod_license,
                   minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range,
                   loader_version_range: loader_version_range, sodium_version_range: sodium_version_range]
tasks.named('processResources', ProcessResources) {
    inputs.properties(modMetadata)
    filesMatching('META-INF/neoforge.mods.toml') { expand(modMetadata) }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    from('LICENSE')
    manifest.attributes('Implementation-Title': mod_name,
            'Implementation-Version': project.version.toString(),
            'Implementation-Vendor': mod_authors,
            'Specification-Title': mod_name,
            'Specification-Version': project.version.toString(),
            'Specification-Vendor': mod_authors,
            'Automatic-Module-Name': 'dev.nightmode.chromalight')
}

repositories {
    // Modrinth is only used by the local dev client setup; repositories must be declared up front.
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name = 'CaffeineMC'; url = 'https://maven.caffeinemc.net/releases' } }
        filter { includeGroup 'net.caffeinemc' }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Optional Sodium compat is compiled against the real renderer; Sodium is not bundled.
    compileOnly "net.caffeinemc:sodium-neoforge-mod:${sodium_version}"
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        // -PquickPlay="New World" loads that save straight from launch, no clicks needed.
        def quickPlay = providers.gradleProperty('quickPlay').getOrNull()
        if (quickPlay) programArguments.addAll('--quickPlaySingleplayer', quickPlay)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Inspect the distributable itself, without loading game classes or starting a client.
tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    doLast {
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        new java.util.jar.JarFile(artifact).withCloseable { jar ->
            for (def required : ['META-INF/neoforge.mods.toml', 'LICENSE', 'chromalight.png',
                                 'chromalight.mixins.json', 'chromalight.sodium.mixins.json',
                                 'assets/chromalight/lang/en_us.json', 'assets/chromalight/lang/ru_ru.json',
                                 'assets/chromalight/textures/gui/icon.png',
                                 'dev/nightmode/chromalight/compat/ChromaLightOptions.class',
                                 'assets/chromalight/shaders/native_light.glsl',
                                 'assets/chromalight/shaders/include/color_space.glsl',
                                 'assets/chromalight/shaders/include/native_lightmap.glsl',
                                 'assets/chromalight/shaders/include/realtime_table.glsl',
                                 'assets/chromalight/shaders/include/vanilla_vertex.glsl',
                                 'assets/chromalight/shaders/include/sodium_vertex.glsl',
                                 'dev/nightmode/chromalight/ChromaLight.class',
                                 'dev/nightmode/chromalight/api/ClientLightSources.class']) {
                if (jar.getEntry(required) == null)
                    throw new GradleException("Release JAR is missing ${required}")
            }
            String metadata = jar.getInputStream(jar.getEntry('META-INF/neoforge.mods.toml')).withCloseable { it.getText('UTF-8') }
            if (metadata.contains('${') || !metadata.contains("version=\"${project.version}\"") ||
                    !metadata.contains("authors=\"${mod_authors}\""))
                throw new GradleException('Release metadata contains stale or unexpanded properties')
            if (jar.manifest.mainAttributes.getValue('Implementation-Version') != project.version.toString())
                throw new GradleException('Release manifest version does not match Gradle')
            def image = jar.getInputStream(jar.getEntry('chromalight.png')).withCloseable { javax.imageio.ImageIO.read(it) }
            if (image == null || image.width != 512 || image.height != 512)
                throw new GradleException('Release icon must be a valid 512 x 512 PNG')
            def forbidden = jar.entries().findAll { entry ->
                entry.name.startsWith('net/caffeinemc/') || entry.name.startsWith('net/fabricmc/') || entry.name.startsWith('net/irisshaders/') || entry.name.startsWith('me/flashyreese/') ||
                        entry.name.startsWith('META-INF/jarjar/') || entry.name.startsWith('META-INF/services/') ||
                        entry.name.startsWith('dev/nightmode/chromalight/validation/') ||
                        entry.name == 'gradle.properties' || entry.name.endsWith('.jfr')
            }
            if (!forbidden.isEmpty()) throw new GradleException("Unexpected dev files in release JAR: ${forbidden}")
            logger.lifecycle("Release JAR VERIFIED: ${artifact.name} (${artifact.length()} bytes), ${mod_authors}, icon, license, expanded metadata; no bundled dev mods")
        }
    }
}
tasks.named('assemble') { dependsOn tasks.named('verifyReleaseJar') }
gradle.projectsEvaluated { tasks.named('check') { setDependsOn([]) } }

// Local dev client setup (Sodium, Iris, compat mods, profiling). Not part of the repository.
if (file('gradle/dev.gradle').isFile()) apply from: 'gradle/dev.gradle'
